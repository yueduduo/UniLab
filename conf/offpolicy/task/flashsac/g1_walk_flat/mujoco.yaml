# @package _global_
defaults:
  - /locomotion/g1_walk_flat_recipe
  - /locomotion/g1_walk_flat_flashsac_reward

training:
  task_name: G1WalkFlat
  sim_backend: mujoco
algo:
  num_envs: 4096
  learning_starts: 49
  max_iterations: 5000
  save_interval: 1000
  updates_per_step: 8
  replay_buffer_n: 256
  tau: 0.05
env:
  reset_base_qvel_limit: 0.5
  curriculum:
    enabled: true
    initial_scale: 0.5
    min_scale: 0.5
    max_scale: 1.0
    level_down_threshold: 150.0
    level_up_threshold: 750.0
    degree: 0.001
  noise_config:
    level: 0.0
    scale_gyro: 0.0
    scale_gravity: 0.0
    scale_joint_vel: 0.1
    scale_linvel: 0.0
reward:
  base_height_target: 0.754
  pose_weights: [0.01, 2.0, 5.0, 0.01, 5.0, 5.0, 0.01, 2.0, 5.0, 0.01, 5.0, 5.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0]
