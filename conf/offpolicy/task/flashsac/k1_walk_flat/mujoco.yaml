# @package _global_
defaults:
  - /locomotion/g1_walk_flat_recipe
  - /locomotion/g1_walk_flat_flashsac_reward

training:
  task_name: K1WalkFlat
  sim_backend: mujoco
algo:
  num_envs: 4096
  learning_starts: 50
  max_iterations: 5000
  save_interval: 1000
  updates_per_step: 8
  batch_size: 2048
  replay_buffer_n: 256
  tau: 0.05
env:
  control_config:
    action_scale: 0.35
  reset_base_qvel_limit: 0.5
  curriculum:
    enabled: true
    initial_scale: 0.5
    min_scale: 0.5
    max_scale: 1.0
    level_down_threshold: 150.0
    level_up_threshold: 750.0
    degree: 0.001
  noise_config:
    level: 0.0
    scale_gyro: 0.0
    scale_gravity: 0.0
    scale_joint_vel: 0.1
    scale_linvel: 0.0
reward:
  # Gait tuning trial — see 奖励函数分析.md §8
  scales:
    penalty_orientation: -15.0
    penalty_ang_vel_xy: -1.5
    upper_body_pose: -0.15
    pose: -0.8
  feet_phase_swing_height: 0.06
  feet_phase_tracking_sigma: 0.008
  base_height_target: 0.55
  min_base_height: 0.35
  # idx 10–21 legs: ↑ Hip_Roll(11,17) Ankle_Roll(15,21); ↓ knee(13,19) for swing flex
  pose_weights: [
    0.01, 2.0, 5.0, 0.01, 5.0, 5.0, 0.01, 2.0, 5.0, 0.01,
    40.0, 200.0, 80.0, 25.0, 40.0, 120.0,
    40.0, 200.0, 80.0, 25.0, 40.0, 120.0,
  ]
