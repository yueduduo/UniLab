# @package _global_
# Run-up phase: walk stack + runup_reach. Kick phase: ball-to-goal terms (see soccer_penalty_kick.py).
defaults:
  - /locomotion/g1_walk_flat_recipe
  - /locomotion/g1_walk_flat_flashsac_reward

training:
  task_name: K1SoccerPenaltyKick
  sim_backend: mujoco
algo:
  num_envs: 4096
  learning_starts: 50
  max_iterations: 2000
  save_interval: 1000
  updates_per_step: 8
  batch_size: 2048
  replay_buffer_n: 256
  tau: 0.05
  actor_lr: 2.0e-4
  critic_lr: 2.0e-4
  algo_params:
    temp_initial_value: 0.02
    temp_target_sigma: 0.30
  warm_start:
    enabled: true
    source_load_run: conf/offpolicy/task/flashsac/k1_soccer_penalty_kick/warm_start/k1_soccer_dribble_mujoco_model_13000.pt
    strict: false
env:
  obs_frame_stack: 1
  control_config:
    action_scale: 0.35
  commands:
    vel_limit:
      - [0.4, 0.0, 0.0]
      - [0.95, 0.0, 0.0]
    rel_standing_envs: 0.0
  gait_phase_init_mode: offset_phase
  reset_base_qvel_limit: 0.5
  max_episode_seconds: 18.0
  curriculum:
    enabled: true
    initial_scale: 0.5
    min_scale: 0.5
    max_scale: 1.0
    level_down_threshold: 150.0
    level_up_threshold: 750.0
    degree: 0.001
  noise_config:
    level: 0.0
    scale_gyro: 0.0
    scale_gravity: 0.0
    scale_joint_vel: 0.1
    scale_linvel: 0.0
  domain_rand:
    randomize_kp: false
    randomize_kd: false
    randomize_base_mass: false
    randomize_body_mass: false
    random_com: false
    randomize_gravity: false
    randomize_ground_friction: false
    randomize_dof_armature: false
    push_robots: false
reward:
  scales:
    runup_reach: 8.893
    runup_speed: 15.0
    forward_progress: 12.5
    tracking_lin_vel: 5.0
    feet_phase: 0.5
    right_foot_to_ball: 8.893
    right_foot_to_ball_progress: 5.0
    runup_success: 10.0
    alive: 0.0
    penalty_runup_feet_still: -5.0
    penalty_vel_direction: -15.0
    tracking_ang_vel: 1.0
    penalty_orientation: -15.0
    penalty_ang_vel_xy: -1.0
    penalty_action_rate: -0.25
    upper_body_pose: -0.10
    pose: -0.04
    ball_to_goal: 10.0
    ball_goal_progress: 16.0
    ball_kick_speed: 120.0
    penalty_ball_vy: -40.0
    penalty_ball_lateral_progress: -40.0
    kick_pose: 8.0
    kick_robot_still: 5.0
    kick_stability: 5.0
    kick_plant_foot_x: 8.0
    kick_plant_foot_order: 6.0
    penalty_kick_plant_foot_order: -10.0
    penalty_ball_pin: -40.0
    goal_scored: 100.0
    term_fall: -1200.0
    term_low: -120.0
    term_runup_timeout: -30.0
    term_kick_timeout: -100.0
    term_ball_missed_goal: -600.0
    term_ball_flew_high: -700.0
    term_ball_backward: -600.0
    term_ball_out_y: -600.0
  feet_phase_swing_height: 0.06
  feet_phase_tracking_sigma: 0.008
  base_height_target: 0.55
  min_forward_speed_for_gait_reward: 0.05
  min_base_height: 0.35
  max_tilt_deg: 65.0
  close_feet_threshold: 0.12
  pose_weights: [
    0.01, 2.0, 5.0, 0.01, 5.0, 5.0, 0.01, 2.0, 5.0, 0.01,
    40.0, 200.0, 80.0, 25.0, 40.0, 120.0,
    40.0, 200.0, 80.0, 25.0, 40.0, 120.0,
  ]
  runup_reach_sigma: 0.30
  runup_reach_sigma_2: 2.0
  right_foot_ball_sigma: 0.30
  right_foot_ball_sigma_2: 2.0
  right_foot_strike_dist: 0.18
  runup_min_forward_speed: 0.40
  runup_speed_curriculum_initial: 0.40
  runup_speed_curriculum_increment: 0.10
  runup_speed_curriculum_interval_iterations: 1000
  runup_speed_curriculum_max_speed: 0.95
  runup_speed_success_curriculum_enabled: true
  runup_speed_success_threshold: 0.15
  runup_speed_success_promotion_updates: 20
  runup_success_rate_ema_alpha: 0.2
  runup_start_distance_curriculum_enabled: true
  runup_start_distance_phase1: [0.20, 0.35]
  runup_start_distance_phase2: [0.35, 0.80]
  runup_start_distance_phase3: [2.0, 2.0]
  runup_start_distance_success_threshold: 0.15
  runup_start_distance_promotion_updates: 20
  runup_start_distance_linear_enabled: true
  runup_start_distance_linear_start: 0.10
  runup_start_distance_linear_end: 1.10
  runup_start_distance_linear_duration_iterations: 10000
  runup_start_distance_linear_jitter: 0.02
  runup_start_distance_linear_success_gate_enabled: true
  runup_start_distance_linear_success_threshold: 0.20
  runup_start_distance_linear_y_jitter_start_distance: 0.50
  runup_start_distance_linear_y_jitter_end_distance: 1.10
  runup_start_distance_linear_y_jitter_max: 0.05
  kick_success_min_ball_forward_progress: 0.30
  right_foot_ball_progress_clip: 1.0
  ball_pin_max_xy_dist: 0.15
  ball_pin_max_ball_speed: 0.08
  ball_pin_max_robot_speed: 0.08
  ball_pin_min_foot_above_ball_z: 0.02
  kick_phase_min_ball_forward_speed: 0.05
  kick_phase_min_robot_forward_speed: 0.15
  kick_phase_max_left_foot_ball_x_error: 0.08
  kick_phase_require_plant_foot_lead: true
  kick_phase_min_base_height: 0.40
  kick_plant_foot_x_sigma: 0.10
  kick_plant_foot_min_lead_m: 0.02
  runup_speed_bonus_cap: 1.0
  ball_to_goal_sigma: 0.35
  ball_goal_progress_sigma: 0.05
  ball_kick_speed_sigma: 2.0
  ball_kick_speed_min_forward: 0.08
  ball_kick_speed_max_forward: 2.5
  kick_pose_sigma: 0.15
  kick_robot_still_sigma: 0.15
  runup_feet_still_sigma: 0.015
  fixed_cmd_lin_speed: 0.75
  runup_ball_dist: 0.35
  runup_max_steps: 300
  runup_timeout_enable_after_iteration: 1
  kick_phase_max_steps: 120
  max_steps: 520
  vel_direction_min_speed: 0.05
  ball_fail_max_height: 2.15
  ball_fail_backward_dist: 0.45
