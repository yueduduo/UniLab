# @package _global_
# Phase 1: same walk reward profile as K1WalkFlat FlashSAC (via shared YAML + K1 gait overrides).
# Phase 2: ball / dribble terms enabled in env via phase2_mask (see soccer_dribble.py).
# MuJoCo owner: algo throughput aligned with k1_walk_flat/mujoco; env/reward aligned with motrix owner.
defaults:
  - /locomotion/g1_walk_flat_recipe
  - /locomotion/g1_walk_flat_flashsac_reward

training:
  task_name: K1SoccerDribble
  sim_backend: mujoco
algo:
  num_envs: 4096
  learning_starts: 50
  max_iterations: 20000
  save_interval: 1000
  updates_per_step: 8
  batch_size: 2048
  replay_buffer_n: 256
  tau: 0.05
  actor_lr: 2.0e-4
  critic_lr: 2.0e-4
  algo_params:
    temp_initial_value: 0.02
    temp_target_sigma: 0.30
  warm_start:
    enabled: false
env:
  obs_frame_stack: 1
  control_config:
    # Phase-1 walk uses the same action scale as K1WalkFlat FlashSAC.
    action_scale: 0.35
  commands:
    # Match k1_walk_flat/motrix (recipe default): forward-only cmd sampling in phase 1.
    vel_limit:
      - [0.4, 0.0, 0.0]
      - [0.7, 0.0, 0.0]
    rel_standing_envs: 0.0
  gait_phase_init_mode: offset_phase
  reset_base_qvel_limit: 0.5
  curriculum:
    enabled: true
    initial_scale: 0.5
    min_scale: 0.5
    max_scale: 1.0
    level_down_threshold: 150.0
    level_up_threshold: 750.0
    degree: 0.001
  noise_config:
    level: 0.0
    scale_gyro: 0.0
    scale_gravity: 0.0
    scale_joint_vel: 0.1
    scale_linvel: 0.0
  domain_rand:
    randomize_kp: false
    randomize_kd: false
    randomize_base_mass: false
    randomize_body_mass: false
    random_com: false
    randomize_gravity: false
    randomize_ground_friction: false
    randomize_dof_armature: false
    push_robots: false
reward:
  # K1WalkFlat FlashSAC gait overrides (phase-1 walk stack)
  scales:
    phase1_reach: 10.0
    phase1_complete: 10.0
    penalty_phase1_vel_direction: -4.0
    tracking_ang_vel: 2.0
    penalty_orientation: -20.0
    penalty_ang_vel_xy: -1.5
    upper_body_pose: -0.15
    pose: -0.8
    # Phase 2 only (masked off until phase1 waypoint reached)
    ball_progress: 1.7
    ball_keep: 3.0
    ball_front: 2.0
    ball_speed_match: 0.6
    ball_approach: 2.4
    ball_moving: 0.6
    ball_still: -0.2
    ball_lost: -1.6
    ball_over_speed: -1.0
    ball_orbit: -0.4
    feet_inward_yaw: -1.4
    feet_step_travel: 30.0
    termination_bad: -20.0
  feet_phase_swing_height: 0.06
  feet_phase_tracking_sigma: 0.008
  base_height_target: 0.55
  min_forward_speed_for_gait_reward: 0.05
  min_base_height: 0.35
  max_tilt_deg: 65.0
  close_feet_threshold: 0.12
  pose_weights: [
    0.01, 2.0, 5.0, 0.01, 5.0, 5.0, 0.01, 2.0, 5.0, 0.01,
    40.0, 200.0, 80.0, 25.0, 40.0, 120.0,
    40.0, 200.0, 80.0, 25.0, 40.0, 120.0,
  ]
  ball_keep_distance: 0.25
  ball_keep_sigma: 0.08
  ball_front_lateral_sigma: 0.16
  ball_speed_sigma: 0.12
  ball_lost_distance: 1.35
  ball_lost_distance_hard: 2.8
  ball_speed_cap: 0.35
  ball_move_speed_target: 0.20
  ball_move_speed_sigma: 0.15
  ball_approach_speed_cap: 1.0
  ball_still_speed_threshold: 0.06
  ball_cmd_deadzone: 0.12
  ball_cmd_kp: 0.9
  fixed_cmd_lin_speed: 0.3
  feet_step_travel_cap: 0.10
  phase1_reach_sigma: 0.3
  phase1_vel_direction_min_speed: 0.05
  phase1_vel_direction_phase2_scale: 0.25
  phase1_max_steps: 200
