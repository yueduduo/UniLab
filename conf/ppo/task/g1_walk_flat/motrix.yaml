# @package _global_
defaults:
  - /locomotion/g1_walk_flat_recipe

training:
  task_name: G1WalkFlat
  sim_backend: motrix
algo:
  num_envs: 2048
  max_iterations: 2200
  empirical_normalization: true
  obs_groups:
    actor:
      - policy
    critic:
      - critic
  policy:
    init_noise_std: 0.5
  algorithm:
    learning_rate: 3.0e-4
    entropy_coef: 5.0e-3
reward:
  base_height_target: 0.765
  min_base_height: 0.5
  pose_weights: [0.01, 1.0, 5.0, 0.01, 5.0, 5.0, 0.01, 1.0, 5.0, 0.01, 5.0, 5.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0, 50.0]
